<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Invoice Chaser architecture</title>
<desc>A trigger starts the Invoice Chaser agent, which uses three tools (check overdue invoices, cash flow summary, draft reminder) built on a shared data loader that reads the invoice CSV.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="560" fill="#ffffff"/>

<!-- Trigger -->
<rect x="230" y="40" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User or scheduled run</text>
<text x="340" y="74" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Starts an invoice check</text>

<line x1="340" y1="84" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Agent -->
<rect x="210" y="124" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Invoice chaser agent</text>
<text x="340" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Powered by Amazon Bedrock</text>

<!-- Agent -> tools -->
<path d="M340,180 L340,205 L140,205 L140,240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="180" x2="340" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340,180 L340,205 L540,205 L540,240" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Tools row -->
<rect x="50" y="240" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="140" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Check overdue</text>
<text x="140" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Finds late invoices</text>

<rect x="250" y="240" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Cash flow summary</text>
<text x="340" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Outstanding totals</text>

<rect x="450" y="240" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="540" y="262" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Draft reminder</text>
<text x="540" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Tone-matched draft</text>

<!-- Tools -> data loader -->
<path d="M140,296 L140,325 L340,325 L340,356" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="356" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M540,296 L540,325 L340,325 L340,356" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Data loader -->
<rect x="210" y="356" width="260" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="340" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">data_loader.py</text>
<text x="340" y="388" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Loads CSV, flags overdue</text>

<line x1="340" y1="400" x2="340" y2="440" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CSV -->
<rect x="210" y="444" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="340" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">accounts_receivable.csv</text>
<text x="340" y="476" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">IBM public dataset</text>

<text x="340" y="524" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">Rule-based logic (teal + coral) is fully testable without AWS — the agent layer (purple) adds Bedrock on top</text>
</svg>
